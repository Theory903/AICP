name: food_order
description: >
  End-to-end food ordering workflow.
  Steps: list menu → add item to cart → view cart → checkout → await confirmation.

steps:
  - id: list_menu
    type: capability
    capability_name: food.list_menu
    description: Retrieve the current menu

  - id: add_to_cart
    type: capability
    capability_name: food.add_to_cart
    description: Add a burger to the cart
    arguments:
      item_id: burger
      quantity: 1

  - id: view_cart
    type: capability
    capability_name: food.view_cart
    description: Inspect cart before checkout

  - id: checkout
    type: capability
    capability_name: food.checkout
    description: Place the order
    arguments:
      delivery_address: "123 Main St"
      payment_method: card

  - id: await_confirmation
    type: wait_event
    description: Wait for the restaurant to confirm the order
    wait_for_event: order.confirmed
    timeout_ms: 30000
