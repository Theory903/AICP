[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aicp-example-payment-transfer"
version = "0.1.1"
description = "AICP Payment Transfer Example"
requires-python = ">=3.10"
dependencies = [
    "aiohttp",
    "aicp-core>=0.1.0",
    "aicp-runtime>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
