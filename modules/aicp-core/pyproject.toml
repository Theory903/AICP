[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aicp-core"
version = "0.3.0"
description = "AICP Core - Protocol models, validation, execution contracts, and local runtime primitives"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "AICP Team" }]
requires-python = ">=3.10"
keywords = ["aicp", "agents", "protocol", "capabilities", "workflow", "policy"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "pydantic>=2.7,<3",
    "jsonschema>=4.21,<5",
    "httpx>=0.27,<1",
    "cryptography>=42,<46",
]

[project.optional-dependencies]
karpathy = [
    "ebooklib>=0.20,<1",
    "beautifulsoup4>=4.14,<5",
    "markdown>=3.5,<4",
    "pygments>=2.17,<3",
]
http = [
    "aiohttp>=3.9,<4",
]
cache = [
    "redis>=5.0,<6",
]
fastapi = [
    "fastapi>=0.110,<1",
]
websocket = [
    "websockets>=12,<16",
]
vault = [
    "hvac>=2,<3",
]
aws = [
    "boto3>=1.34,<2",
]
gcp = [
    "google-cloud-storage>=2.16,<3",
]
yaml = [
    "pyyaml>=6.0,<7",
]
all = [
    "aiohttp>=3.9,<4",
    "redis>=5.0,<6",
    "fastapi>=0.110,<1",
    "websockets>=12,<16",
    "hvac>=2,<3",
    "boto3>=1.34,<2",
    "google-cloud-storage>=2.16,<3",
    "pyyaml>=6.0,<7",
]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.23,<1",
    "pytest-cov>=5,<6",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-PyYAML>=6.0.12",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["aicp*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",
]

[tool.ruff.lint.isort]
known-first-party = ["aicp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra"

[tool.mypy]
python_version = "3.10"
mypy_path = ["src"]
explicit_package_bases = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_return_any = true
warn_unreachable = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true
pretty = true

[[tool.mypy.overrides]]
module = [
    "redis.*",
    "jsonschema.*",
    "aiohttp.*",
    "websockets.*",
    "hvac.*",
    "boto3.*",
    "google.cloud.*",
]
ignore_missing_imports = true
