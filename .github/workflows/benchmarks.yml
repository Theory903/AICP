name: Benchmarks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  benchmarks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          pip install -e ./packages/core
          pip install pytest pytest-asyncio fastapi httpx
      - name: Run benchmarks
        run: make test-bench
