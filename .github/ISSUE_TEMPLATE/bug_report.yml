name: Bug Report
description: Report a bug, unexpected behavior, or test failure
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please fill in the details below.

  - type: dropdown
    id: component
    attributes:
      label: Component
      description: Which part of AICP is affected?
      options:
        - Core (domain models, validation)
        - Runtime (services, execution engine)
        - CLI
        - Workflow Engine
        - AI Plane (planner, judge, memory)
        - Spec / Schemas
        - Adapters
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AICP Version
      placeholder: "e.g., v0.3.0"
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug and what you expected to happen.
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      description: Steps to reproduce. Include commands, code snippets, or API calls.
      placeholder: |
        1. Run `aicp run ...`
        2. Observe ...
        3. Error: ...
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Paste any error messages, stack traces, or test output.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Before submitting
      options:
        - label: I have searched existing issues and this is not a duplicate
          required: true
        - label: I have included the AICP version and component
          required: true
