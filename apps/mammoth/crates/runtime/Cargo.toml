[package]
name = "mammoth-runtime"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
telemetry = ["dep:prometheus"]

[dependencies]
anyhow = "1"
async-trait = "0.1"
cpal = "0.17"
crossterm = "0.28"
hound = "3.5"
indexmap = "2"
sha2 = "0.10"
glob = "0.3"
lsp = { path = "../lsp" }
prometheus = { version = "0.13", optional = true }
ratatui = "0.29"
regex = "1"
reqwest = { version = "0.12", features = ["json", "multipart"] }
russh = "0.44"
russh-keys = "0.44"
serde = { version = "1", features = ["derive"] }
serde_json.workspace = true
tokio = { version = "1", features = ["io-util", "macros", "process", "rt", "rt-multi-thread", "time"] }
toml = "0.8"
tracing = "0.1"
url = "2"
walkdir = "2"

[dev-dependencies]
mammoth-server = { path = "../server" }
serde_json.workspace = true
toml = "0.8"

[lints]
workspace = true
