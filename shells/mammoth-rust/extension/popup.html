<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mammoth</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 360px;
      min-height: 480px;
      max-height: 600px;
      display: flex;
      flex-direction: column;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 13px;
      background: #111;
      color: #e8e8e8;
    }

    header {
      padding: 10px 14px;
      border-bottom: 1px solid #222;
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #0d0d0d;
    }
    header .title { font-weight: 600; font-size: 14px; }
    header .status {
      font-size: 11px;
      color: #888;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    header .status .dot {
      width: 7px; height: 7px;
      border-radius: 50%;
      background: #4caf50;
    }
    header .status .dot.disconnected { background: #e53935; }

    #messages {
      flex: 1;
      overflow-y: auto;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .msg {
      max-width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      line-height: 1.5;
      word-break: break-word;
      white-space: pre-wrap;
      font-size: 12px;
    }
    .msg.user { background: #1a1a2e; color: #c5c8ff; align-self: flex-end; }
    .msg.assistant { background: #1a1a1a; border: 1px solid #2a2a2a; }
    .msg.system { background: #1a2a1a; color: #888; align-self: center; font-size: 11px; }
    .msg.approval {
      background: #2a1a1a;
      border: 1px solid #5a2a2a;
      color: #ffb3b3;
    }
    .msg.approval .approval-actions { margin-top: 8px; display: flex; gap: 6px; }
    .msg.approval button {
      flex: 1;
      padding: 4px 8px;
      border-radius: 4px;
      border: none;
      font-size: 12px;
      cursor: pointer;
    }
    .msg.approval .btn-approve { background: #1a3a1a; color: #4caf50; }
    .msg.approval .btn-deny { background: #3a1a1a; color: #e53935; }

    #input-area {
      padding: 10px;
      border-top: 1px solid #222;
      display: flex;
      gap: 6px;
      background: #0d0d0d;
    }
    #msg-input {
      flex: 1;
      background: #1a1a1a;
      border: 1px solid #333;
      border-radius: 6px;
      color: #e8e8e8;
      font-size: 12px;
      padding: 7px 10px;
      outline: none;
      resize: none;
      font-family: inherit;
    }
    #msg-input:focus { border-color: #555; }
    #send-btn {
      background: #2a2a4a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #c5c8ff;
      font-size: 12px;
      padding: 7px 12px;
      cursor: pointer;
    }
    #send-btn:hover { background: #3a3a6a; }
    #send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  </style>
</head>
<body>
  <header>
    <span class="title">Mammoth</span>
    <span class="status">
      <span class="dot" id="status-dot"></span>
      <span id="status-text">Connecting…</span>
    </span>
  </header>

  <div id="messages">
    <div class="msg system">Mammoth Extension channel</div>
  </div>

  <div id="input-area">
    <textarea id="msg-input" rows="1" placeholder="Ask Mammoth…"></textarea>
    <button id="send-btn">Send</button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
