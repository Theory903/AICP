[package]
name = "mammoth-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "mammoth"
path = "src/main.rs"

[dependencies]
aicp = { path = "../aicp" }
api = { path = "../api" }
commands = { path = "../commands" }
compat-harness = { path = "../compat-harness" }
crossterm = "0.28"
pulldown-cmark = "0.13"
ratatui = "0.29"
rustyline = "15"
mammoth-runtime = { path = "../runtime" }
server = { package = "mammoth-server", path = "../server" }
plugins = { path = "../plugins" }
serde_json.workspace = true
syntect = "5"
tokio = { version = "1", features = ["rt-multi-thread", "time"] }
tools = { path = "../tools" }

[lints]
workspace = true
