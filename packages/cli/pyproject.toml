[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aicp_cli"]

[project]
name = "aicp-cli"
version = "0.1.0"
description = "AICP CLI - Command-line interface"
requires-python = ">=3.10"
dependencies = [
    "aicp-core>=0.1.0",
    "aicp-connect-openapi>=0.1.0",
    "aicp-connect-fastapi>=0.1.0",
    "aicp-connect-mcp>=0.1.0",
    "aicp-connect-postman>=0.1.0",
    "aicp-connect-har>=0.1.0",
    "aicp-connect-curl>=0.1.0",
    "click>=8.1.0",
    "pyyaml>=6.0",
    "rich>=13.0.0",
]

[project.scripts]
aicp = "aicp_cli.main:cli"

