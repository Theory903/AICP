[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aicp_cli"]

[project]
name = "aicp-cli"
version = "0.1.0"
description = "AICP CLI - Command-line interface"
requires-python = ">=3.10"
dependencies = [
    "aicp-core>=0.1.0",
]

[project.scripts]
aicp = "aicp_cli.__main__:main"
