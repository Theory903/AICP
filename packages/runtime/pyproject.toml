[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aicp-runtime"
version = "0.1.0"
description = "AICP Runtime - Governed execution engine"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "AICP Team" }]
requires-python = ">=3.10"
dependencies = [
    "aicp-core>=0.1.0",
    "fastapi>=0.110",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "httpx>=0.27",
    "ruff>=0.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
