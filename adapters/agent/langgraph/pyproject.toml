[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "aicp-connect-langgraph"
version = "0.1.1"
description = "AICP LangGraph adapter — expose AICP capabilities as LangGraph nodes"
requires-python = ">=3.10"
dependencies = ["aicp-core>=0.1.0", "langgraph>=0.1.0"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-asyncio>=0.21"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
